server {
    listen 80;

    # Static files
    location /static/ {
        proxy_pass http://bmz-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Media files
    location /media/ {
        proxy_pass http://bmz-prod:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API routes - must come before page routes
    location /api/auth/ {
        proxy_pass http://bmz-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/users/ {
        proxy_pass http://bmz-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/products/ {
        proxy_pass http://bmz-prod:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cart/ {
        proxy_pass http://bmz-cart:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/orders/ {
        proxy_pass http://bmz-orders:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # All page routes go to auth service
    location / {
        proxy_pass http://bmz-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
