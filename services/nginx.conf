server {
    listen 80;

    # Auth service - pages
    location / {
        proxy_pass http://bmz-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /login/ {
        proxy_pass http://bmz-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /register/ {
        proxy_pass http://bmz-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /dashboard/ {
        proxy_pass http://bmz-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Products service - pages
    location /products/ {
        proxy_pass http://bmz-prod:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cart service - pages
    location /cart/ {
        proxy_pass http://bmz-cart:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /checkout/ {
        proxy_pass http://bmz-cart:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Orders service - pages
    location /orders/ {
        proxy_pass http://bmz-orders:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API routes
    location /api/auth/ {
        proxy_pass http://bmz-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/users/ {
        proxy_pass http://bmz-auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/products/ {
        proxy_pass http://bmz-prod:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/cart/ {
        proxy_pass http://bmz-cart:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/orders/ {
        proxy_pass http://bmz-orders:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
